<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Games</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Games</h1>
    <input type="text" id="search" placeholder="Search games...">
  </header>

  <main id="grid" class="grid">
    <!-- game boxes get injected here by games.js -->
  </main>

  <script src="games.js"></script>
  <script>
    const grid = document.getElementById('grid');
    const search = document.getElementById('search');

    function render(list) {
      grid.innerHTML = '';
      list.forEach(game => {
        const a = document.createElement('a');
        a.className = 'box';
        a.href = `game.html?g=${encodeURIComponent(game.folder)}`;

        const img = document.createElement('img');
        img.src = game.thumb || 'thumb-placeholder.svg';
        img.alt = game.title;
        img.loading = 'lazy';

        const label = document.createElement('span');
        label.textContent = game.title;

        a.appendChild(img);
        a.appendChild(label);
        grid.appendChild(a);
      });
    }

    render(GAMES);

    search.addEventListener('input', () => {
      const q = search.value.toLowerCase();
      render(GAMES.filter(g => g.title.toLowerCase().includes(q)));
    });
  </script>

</body>
</html>
